name: NVD to MoreFixes Pipeline
on:
  schedule:
    - cron: '0 */12 * * *' # Run twice a day
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Run in debug mode?'
        required: false
        default: 'false'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # MoreFixes often requires submodules (Prospector)
          lfs: true # Crucial for 1GB files

      - name: Start MoreFixes Services
        run: |
          docker compose up -d
          # Wait for PostgreSQL/MoreFixes to be healthy
          sleep 30 

      - name: Shutdown Services
        if: always()
        run: docker compose down -v
