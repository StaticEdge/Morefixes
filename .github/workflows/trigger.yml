name: NVD to MoreFixes Pipeline
on:
  schedule:
    - cron: '0 */12 * * *' # Run twice a day
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Run in debug mode?'
        required: false
        default: 'false'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # MoreFixes often requires submodules (Prospector)
          
      - name: Download NVD CPE Dictionary
        run: |
          mkdir -p ./data_temp
          # Download the zipped dictionary from NIST
          curl -L https://nvd.nist.gov/feeds/xml/cpe/dictionary/official-cpe-dictionary_v2.3.xml.zip -o ./data_temp/cpe.zip
          # Unzip it
          unzip ./data_temp/cpe.zip -d ./data_temp
          # Move it to the location you will mount to Docker
          mv ./data_temp/official-cpe-dictionary_v2.3.xml ./official-cpe-dictionary_v2.3.xml
          echo "CPE Dictionary downloaded successfully."

      - name: Start MoreFixes Services
        run: |
          docker compose up 
          # Wait for PostgreSQL/MoreFixes to be healthy
          sleep 30 

      - name: Shutdown Services
        if: always()
        run: docker compose down -v
