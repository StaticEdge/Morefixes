name: NVD to MoreFixes Pipeline
on:
  schedule:
    - cron: '0 */12 * * *' # Run twice a day
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Run in debug mode?'
        required: false
        default: 'false'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # MoreFixes often requires submodules (Prospector)
          
      - name: Download Data from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download the specific file from your release
          gh release download v0.0.1-data --pattern 'official-cpe-dictionary_v2.3.xml.zip'
          
          # Unzip and prepare for Docker
          unzip official-cpe-dictionary_v2.3.xml.zip
          echo "File ready for mounting."

      - name: Start MoreFixes Services
        run: |
          docker compose up 
          # Wait for PostgreSQL/MoreFixes to be healthy
          sleep 30 

      - name: Shutdown Services
        if: always()
        run: docker compose down -v
