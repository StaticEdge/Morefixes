version: "3.8"

services:
  # 1. The Database Service (Your existing config)
  postgres:
    image: postgres:17
    command: postgres -c 'max_connections=1000'
    container_name: morefixes_db
    restart: always
    environment:
      POSTGRES_USER: postgrescvedumper
      POSTGRES_PASSWORD: a42a18537d74c3b7e584c769152c3d
      POSTGRES_DB: postgrescvedumper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgrescvedumper"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d

  # 2. The Python App Service
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: morefixes_app
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["bash", "/app/Code/run.sh"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgrescvedumper
      POSTGRES_PASSWORD: a42a18537d74c3b7e584c769152c3d
      POSTGRES_DB: postgrescvedumper

